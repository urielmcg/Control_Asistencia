<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d3b66" />
      <stop offset="100%" stop-color="#1d4e89" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e63946" />
      <stop offset="100%" stop-color="#d90429" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Escudo Base Circular -->
  <circle cx="200" cy="200" r="185" fill="#ffffff" stroke="#0d3b66" stroke-width="8" filter="url(#shadow)"/>
  <circle cx="200" cy="200" r="172" fill="none" stroke="#e63946" stroke-width="3" stroke-dasharray="8 6"/>

  <!-- Anillo Superior e Inferior con Texto -->
  <path id="curveTop" d="M 50 200 A 150 150 0 0 1 350 200" fill="none" />
  <path id="curveBottom" d="M 350 200 A 150 150 0 0 1 50 200" fill="none" />

  <text font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="900" fill="#0d3b66" letter-spacing="3.5">
    <textPath href="#curveTop" startOffset="50%" text-anchor="middle">
      CENTRO CULTURAL DON BOSCO
    </textPath>
  </text>
  
  <text font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#e63946" letter-spacing="4">
    <textPath href="#curveBottom" startOffset="50%" text-anchor="middle">
      • RAZÓN • RELIGIÓN • AMOR •
    </textPath>
  </text>

  <!-- Emblema Central Salesiano / Don Bosco -->
  <g transform="translate(200, 205)">
    <!-- Cruz / Guía Central -->
    <rect x="-8" y="-95" width="16" height="150" rx="6" fill="#e63946" />
    <rect x="-42" y="-60" width="84" height="16" rx="6" fill="#e63946" />

    <!-- Libro Abierto / Educación / Saber -->
    <path d="M 0,-15 C -30,-30 -65,-30 -85,-15 L -85,45 C -65,30 -30,30 0,45 Z" fill="#0d3b66" />
    <path d="M 0,-15 C 30,-30 65,-30 85,-15 L 85,45 C 65,30 30,30 0,45 Z" fill="#1d4e89" />
    <path d="M 0,-15 L 0,45" stroke="#ffffff" stroke-width="3" />
    
    <!-- Líneas del libro (páginas) -->
    <path d="M -70,-2 C -50,-12 -25,-12 -10,-2" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.8" />
    <path d="M -70,14 C -50,4 -25,4 -10,14" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.8" />
    <path d="M -70,30 C -50,20 -25,20 -10,30" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.8" />
    
    <path d="M 10,-2 C 25,-12 50,-12 70,-2" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.8" />
    <path d="M 10,14 C 25,4 50,4 70,14" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.8" />
    <path d="M 10,30 C 25,20 50,20 70,30" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.8" />

    <!-- Estrella Superior de la Esperanza -->
    <polygon points="0,-115 5,-98 22,-98 9,-87 14,-70 0,-81 -14,-70 -9,-87 -22,-98 -5,-98" fill="#e63946" />

    <!-- Iniciales CCDB Estilizadas -->
    <rect x="-55" y="55" width="110" height="26" rx="13" fill="#0d3b66" />
    <text x="0" y="73" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">CCDB</text>
  </g>
</svg>
